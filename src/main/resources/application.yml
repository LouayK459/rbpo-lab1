spring:
  application:
    name: "1БИБ23421"

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/rbpo_lab4}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: delivery

  sql:
    init:
      mode: never

jwt:
  secret: "${JWT_SECRET}"
  # Milliseconds; positive whole seconds. Defaults: access 15 minutes, refresh 7 days.
  accessExpiration: ${JWT_ACCESS_EXPIRATION:900000}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000}
